#:schema ../../schemas/pipeline.schema.json
# A reference pipeline config: every table and key, annotated.
# The package's tests load it, build a routing plan from it and check that it writes
# every key of the JSON Schema, so it stays valid and complete.
#
# The config is operations, not definitions: which coding agent, model and
# credential each kind of task runs on, where it fails over to, and budgets that
# outrank the ones its agent_task(...) declares.

# --- run-wide defaults --------------------------------------------------------

[defaults]
_comment = "a note for the reader; every table takes one, and contraagent ignores it"
agent = "claude"                    # a registered coding agent: claude, omp, omp-rpc, opencode, pi, codex
effort = "medium"                   # checked against the agent's CLI (Backend.effort_levels)
credential = "personal"             # without it: "ambient", the host's own setup
# model = "claude-sonnet-5-5"       # without it: the agent's default model
# model_failover = false            # hand same-agent fallback models to the CLI's own flag
# max_passes = 10                   # passes each `while` loop of flow code may make (Pipeline(max_passes=)); a function's @max_passes(n) outranks it
# context_warn_pct = 80             # context_warn_pct of every kind with a context_budget and none of its own
# preflight = "stop"                # probe every route first; a kind with no route left: "substitute" or "stop"; "off" (default)

# How many running tasks may hold each claimed name (agent_task(claims=...)) at once, by the
# name or an fnmatch pattern that gives each name it matches a capacity of its own (a limit
# shared by many tasks needs one name they all claim). A number, or what one running task
# needs of the host (PerTask): memory_mb (the most one task takes, its agent included)
# and/or cores. Each running one holds its memory_mb until it ends; as many at once as the
# free memory (MemAvailable) and the usable cores hold, one while none runs.
# Pipeline(claim_capacity=) outranks it key by key; a name that no entry gives: one at a time.
[defaults.claim_capacity]
"heavy:*" = 2                       # claims=["heavy:{kind}"]: two at a time of each kind
gpu = 4                             # claims=["gpu"]: four at a time across the run
index = { memory_mb = 1500, cores = 1 }  # claims=["index"]: a local index server of about 1.5 GB each

# The failover chain every kind without its own shares; block order is hop order.
[[defaults.fallbacks]]
agent = "omp"
model = "opencode-go/glm-5.3"       # OpenCode Go: its 5-hour, weekly and monthly usage is read at each launch
credential = "ambient"              # the OPENCODE_API_KEY omp finds: the environment, else its .env files (~/.env)

# --- one table per kind of task ---------------------------------------------

[tasks.summarize]                   # agent_task("summarize", ...)
# Routing: each key outranks [defaults] for this kind.
agent = "claude"
model = "claude-sonnet-5-5"
effort = "high"
# credential = "personal"
# model_failover = false
# Budgets. max_turns and timeout_s are required for every kind (here or in agent_task).
max_turns = 20                      # turns per launch; outranks agent_task(..., max_turns=10)
timeout_s = 600                     # seconds per launch
max_budget_usd = 2.0                # cost per launch, as the coding agent reports it
stall_s = 300                       # stop a launch whose transcript is silent this long
context_budget = 150000             # stop a launch once one call's input passes this many tokens
context_warn_pct = 80               # warn (journal context_warned, a log line) once a launch's peak context passes 80% of context_budget; it still runs
max_denials = 5                     # stop a launch after this many permission denials
# What a launch stopped for its time wrote is a partial result when it passes its checks.
partial_on = ["timeout", "stalled"]  # stops after which the output is kept; outranks agent_task(..., partial_on=)
max_corrections = 2                 # 0 to 20 (default 3): how many times in all an output that fails its checks goes back to the session with the errors, by the stop hook or a resume
max_continuations = 1               # 0 to 10 (default 0): how many times a launch stopped on max_turns goes on in the same session, with the whole budget again
max_turns_growth = 2.0              # 1 to 10 (default 1): what each fresh attempt multiplies max_turns by; at 1, max_turns gets no fresh attempt
# Scheduling and retries.
max_concurrent = 2                  # tasks of this kind at once (the run's own cap still applies)
retries = 2                         # fresh-session attempts after the first, each after one that made no progress
retry_backoff_base = 2.0            # seconds, doubled per attempt
# keep_failed_changes = false       # leave the files a failed attempt created under its changes= patterns in place

[tasks.analyze]                     # agent_task("analyze", ..., requires=["zdr"])
credential = "zdr"                  # must carry every trait the task requires
max_turns = 30
timeout_s = 1200
# Tools its launches may not use, in Claude Code's names and patterns. Claude Code and
# opencode deny a pattern too (opencode a Bash command pattern, any other tool whole), pi
# whole tools only; a route on omp or codex is refused, so this kind's chain stays on claude.
disallowed_tools = ["WebFetch", "Bash(git push:*)"]

# A kind's own failover chain; block order is hop order. A hop that names no
# credential keeps the kind's own, and every hop is checked like the primary.
[[tasks.analyze.fallbacks]]
agent = "claude"
model = "claude-opus-5-5"

[tasks.research]                    # agent_task("research", ...)
credential = "subs"                 # a pool: two OAuth tokens taking turns
model = "claude-sonnet-5-5"
max_turns = 15
timeout_s = 600
# A launch that ended well after a safety stop of one of these parts starts again on the
# next hop: "response" (its own model's response) and "tool" (a request of a tool's model).
safety_stop_failover = ["response", "tool"]

[[tasks.research.fallbacks]]        # another agent, another identity: omp through the gateway
agent = "omp"
model = "litellm/claude-sonnet-5-5"
credential = "company-gateway"
# The stops of an earlier hop's launch this hop is for (without stops, every stop): a task
# refused on the primary passes this hop over.
stops = ["rate_limited", "api_error", "auth_failed"]

[[tasks.research.fallbacks]]        # another model, for what the primary refused; a safety stop counts as "refused"
agent = "claude"
model = "claude-opus-5-5"
stops = ["refused"]

# A base kind's table: every implementation kind of it (review-python, review-go) starts from it.
[tasks.review]                      # agent_task("review", implementations={"python": ..., "go": ...})
model = "claude-sonnet-5-5"
max_turns = 20
timeout_s = 600

# An implementation kind's own table: each key it gives replaces the base kind's (fallbacks too).
[tasks.review-go]
model = "claude-opus-5-5"
timeout_s = 900

# --- credentials --------------------------------------------------------------
# Secrets are references, read in the launching process: env:NAME or file:/path.
# `traits` are labels a task's `requires` is matched against. Every type takes
# `isolate`: true (the default but for ambient) keeps the coding agent from using
# anything it would load by itself (stored logins, keys in its own config) instead
# of this credential; and the quota caps max_five_hour_pct and max_seven_day_pct.

[credentials.host]                  # the host's own setup, as the built-in "ambient" is, with caps of its own
type = "ambient"
isolate = false                     # the default for ambient: the agent loads what it would load by itself
max_five_hour_pct = 95

[credentials.personal]              # a /login (Claude Code), a profile login (omp) or a stored login (opencode)
type = "subscription"
provider = "anthropic"              # the default; omp, pi and opencode name the provider whose login it is
isolate = true                      # the default: only this login, never a key the agent finds by itself
max_five_hour_pct = 90              # quota caps: past them the credential rests until the window resets,
max_seven_day_pct = 95              # and its tasks take the next hop (or are deferred with none left)
# config_dir = "/home/me/.claude-work"   # Claude Code: the CLAUDE_CONFIG_DIR holding the login
# profile = "work"                       # omp: the profile holding it

[credentials.zdr]                   # a provider's own API key
type = "api_key"
provider = "anthropic"
key = "env:ZDR_ANTHROPIC_API_KEY"
traits = ["zdr"]
isolate = true

[credentials.company-gateway]       # your own endpoint (LiteLLM, a proxy, a self-hosted API)
type = "gateway"
base_url = "env:LITELLM_BASE_URL"   # or a literal URL
token = "env:LITELLM_API_TOKEN"
isolate = true
# auth = "bearer"                   # or "api_key" (sent as x-api-key; Claude Code only)
# provider = "litellm"              # how omp and opencode address it: models are litellm/<model>
# headers = { X-Team = "research" } # Anthropic-API endpoints only

[credentials.token-a]               # long-lived OAuth tokens (claude setup-token)
type = "oauth_token"
provider = "anthropic"              # the default
token = "env:CLAUDE_TOKEN_A"
isolate = true

[credentials.token-b]
type = "oauth_token"
token = "env:CLAUDE_TOKEN_B"

[credentials.subs]                  # several credentials used as one
type = "pool"
members = ["token-a", "token-b"]
strategy = "round_robin"            # or "in_order": the next member only after a 429
cooldown_s = 900                    # rest after a 429 when the provider states no retry-after
isolate = true
max_five_hour_pct = 90              # each member's cap when it sets none of its own
max_seven_day_pct = 95

# Claude Code only, from here on.
[credentials.federated]             # Anthropic workload identity federation
type = "workload_identity"
provider = "anthropic"              # the default
federation_rule_id = "fdrl_0123"
organization_id = "00000000-0000-0000-0000-000000000000"
identity_token_file = "/var/run/secrets/tokens/anthropic"  # the identity token, exchanged for API access
service_account_id = "svac_0123"    # optional
workspace_id = "wrkspc_0123"        # optional
isolate = true

[credentials.aws]                   # Amazon Bedrock
type = "bedrock"
region = "us-east-1"
aws_profile = "bedrock"             # an AWS profile; without it the default chain
# bearer = "env:AWS_BEARER_TOKEN_BEDROCK"  # or a Bedrock API key instead
isolate = true

[credentials.gcp]                   # Google Vertex AI
type = "vertex"
project = "my-project"
region = "us-east5"
credentials_file = "/etc/gcp/vertex.json"  # a service-account key or a federation config; without it the default
isolate = true

# --- the pipeline's own tables ------------------------------------------------

[pipeline.report]                   # a pipeline table: contraagent.pipeline_table("report") in a run
title = "Weekly summary"            # any keys: contraagent never checks them
sections = ["changes", "risks"]
