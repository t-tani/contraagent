#:schema ../../schemas/pipeline.schema.json
# One kind, two accounts. The kind runs as `team`; a task call that names
# `company` (flow.py) runs as `company` on the primary and on the failover hop.

[tasks.summarize]
agent = "claude"
model = "claude-opus-5-5"
credential = "team"
max_turns = 20
timeout_s = 600

# A 429 moves the task to this hop, as the credential its call named, else as `team`.
[[tasks.summarize.fallbacks]]
agent = "claude"
model = "claude-sonnet-5-5"

[credentials.team]
type = "api_key"
provider = "anthropic"
key = "env:TEAM_ANTHROPIC_API_KEY"

[credentials.company]
type = "api_key"
provider = "anthropic"
key = "env:COMPANY_ANTHROPIC_API_KEY"
