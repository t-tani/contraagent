# The monitor under /monitor/ of a site that serves other paths too: this block goes
# into the site's `server` block, and the monitor runs on the same host with
#
#   contraagent monitor --runs-dir runs --base-path /monitor
#
# (`contraagent hub --base-path /monitor` for a hub).

location /monitor/ {
    # The / at the end takes /monitor off the path: the monitor answers at /.
    proxy_pass http://127.0.0.1:8787/;
    # `Host` is the address above, which the monitor answers. To pass the name the
    # browser used instead (proxy_set_header Host $host;), name it with --allow-host.
    proxy_http_version 1.1;
    # The live feeds are server-sent events: each event goes on as it is written,
    # and a feed stays open for as long as the reader watches.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # For a hub, the relays send files up to its --max-blob-mb (256 MiB by default):
    # client_max_body_size 256m;
}
