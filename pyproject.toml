[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "contraagent"
version = "0.1.0"
description = "Run coding-agent CLIs (claude -p, omp) as typed, supervised, observable tasks: contracts, failover, scheduling, resume, live monitor"
readme = "src/contraagent/docs/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomoaki Tani" }]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "psutil>=7.2.2,<8"]
keywords = ["coding-agent", "claude", "llm", "agents", "pipeline", "orchestration", "supervisor", "failover", "monitoring"]
# No "License ::" classifier: PEP 639 forbids it next to a `license` expression.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/t-tani/contraagent"
Documentation = "https://t-tani.github.io/contraagent/"
Source = "https://github.com/t-tani/contraagent"
Issues = "https://github.com/t-tani/contraagent/issues"
Changelog = "https://github.com/t-tani/contraagent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
monitor = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=3.0"]
hub = ["contraagent[monitor]", "httpx2>=2.3", "psycopg[binary]>=3.2", "boto3>=1.34", "zstandard>=0.25"]

[project.scripts]
contraagent = "contraagent._internal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6.2",
    "coverage>=7.10",       # [tool.coverage.run] patch = ["subprocess"]
    "httpx2>=2.3",          # fastapi.testclient (starlette 1.2 and later)
    "httpx>=0.27",          # fastapi.testclient under a starlette before 1.2 (the lowest-direct CI job)
    "ruff>=0.6",
    "pyright>=1.1.400",
    "contraagent[hub]",
    "pytest-xdist>=3.8",
    "griffe==2.3.0",        # tests/api: the public API snapshot; `griffe check`
    "import-linter>=2.15",
    "towncrier>=26.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contraagent"]


[tool.hatch.build.targets.sdist]
# The sources of the web UI belong in the sdist; what Node installs or builds
# from them does not (hatch reads only the root .gitignore). Excluded
# directories must not be entered at all: hatch follows symlinks and visits each
# directory once, and pnpm links the workspace packages from node_modules, so
# walking node_modules first would make web/packages look already visited.
skip-excluded-dirs = true
exclude = [
    "web/node_modules",
    "web/**/node_modules",
    "web/**/dist",
    "web/**/.astro",
    "web/e2e/.runs",
    "web/test-results",
    "web/playwright-report",
    "web/packages/ui/custom-elements.json",
    "docs/assets",   # the root README's logo (brand/) and screenshots (`pnpm --dir web screenshots`)
]

# The changelog: one fragment per user-visible change in changelog.d/ (`<slug>.<type>.md`,
# or `+<slug>.<type>.md` for an orphan), its types Keep a Changelog's sections in their order.
# `uv run towncrier build --version X` writes them into CHANGELOG.md at a release.
[tool.towncrier]
name = "contraagent"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
template = "changelog.d/template.md"
ignore = []   # a file here whose name has no fragment type fails the build
orphan_prefix = "+"
issue_format = ""
issue_pattern = "[a-z0-9][a-z0-9_-]*"   # the slug
wrap = false
all_bullets = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests run against the installed (editable) package, as the subprocesses they spawn do.
# In parallel (pytest-xdist), at most 6 processes: past that the suite waits on CPU, not tests.
# `--dist loadgroup` keeps the tests of one `xdist_group` on one worker. `-n0` runs it in one process.
addopts = "-m 'not live and not e2e and not perf' -n auto --maxprocesses=6 --dist loadgroup"
# Every warning fails the tests: a deprecated name contraagent itself still uses, a new
# deprecation in a dependency, a connection or file left open. An exception names the
# warning's source and why it stays; each one is raised only by the oldest versions that
# the lowest-direct CI job installs, from that dependency's own code.
filterwarnings = [
    "error",
    # The TestClient of starlette 0.36 (with fastapi 0.110) names anyio.abc.BlockingPortal, an alias anyio deprecated.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
    # The TestClient of starlette 0.36 passes `app=` to httpx.Client, which httpx 0.27 deprecated.
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning:httpx._client",
    # botocore 1.34 (with boto3 1.34) calls datetime.utcnow(), which Python 3.12 deprecated.
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning:botocore.auth",
]
markers = [
    "perf: times a view over a large made-up runs directory (minutes, machine-dependent); run with `uv run pytest -m perf -s`",
    "live: calls real coding agents and spends tokens; run with `CONTRAAGENT_LIVE=1 uv run pytest -m live`",
    "e2e: the hub and relays as real processes over Postgres and RustFS in docker; run with `uv run pytest -m e2e`",
]

[tool.coverage.run]
source = ["contraagent"]
branch = true
# The tests run `python -m contraagent` and hook scripts as child processes;
# measure those too (coverage >= 7.10).
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID", "T20", "RUF100"]
ignore = [
    "E731",   # a lambda bound to a name reads fine in tests and callbacks
    "B008",   # Overrides() as a frozen default argument is deliberate
    "UP042",  # Stop stays a (str, Enum): StrEnum would change what str(Stop.X) prints
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702", "B018", "T20"]
"src/contraagent/_internal/plugins/scaffold.py" = ["E501"]   # a template's markdown table
# The library reports through `logging`; only the command line and the examples print.
"src/contraagent/_internal/cli.py" = ["T20"]
"src/contraagent/docs/examples/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["contraagent"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# `uv run lint-imports` (and tests/test_layers.py) checks the layers of AGENTS.md
# ("Public API and layers") and of the `src/contraagent/_internal/__init__.py` docstring.
# The tests are not in the graph: they test `_internal` directly.
[tool.importlinter]
root_packages = ["contraagent", "contraagent.docs"]   # contraagent.docs: a namespace package, the examples in it
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Each layer of _internal imports only the layers above it in the docstring's list"
type = "layers"
containers = ["contraagent._internal"]
exhaustive = true   # every module of _internal is in a layer
layers = [
    "cli",
    "testing",
    "hub",
    "monitor",
    "pipeline",
    "plugins",
    "execution",
    "routing",
    "contracts",
    "backends",
    "dispatch",
    "runs",
    "docs",
    "public",
    "commandline",
    "platform",
    "errors",
]

[[tool.importlinter.contracts]]
id = "leaves"
name = "platform/ and commandline are leaf modules, importing nothing else of the package"
type = "independence"
# With the layers above, neither may import anything of _internal but the other two, and
# independence forbids those.
modules = ["contraagent._internal.errors", "contraagent._internal.platform", "contraagent._internal.commandline"]

[[tool.importlinter.contracts]]
id = "runs"
name = "runs/ imports only the standard library and platform/"
type = "forbidden"
source_modules = ["contraagent._internal.runs"]
forbidden_modules = [
    "contraagent._internal.errors",
    "contraagent._internal.commandline",
    "contraagent._internal.public",
    "contraagent._internal.docs",
    "pydantic",
    "fastapi",
    "starlette",
    "uvicorn",
    "sse_starlette",
    "httpx2",
    "psycopg",
    "boto3",
    "zstandard",
    "yaml",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "dispatch"
name = "dispatch/ imports only the standard library, pydantic and runs/"
type = "forbidden"
source_modules = ["contraagent._internal.dispatch"]
forbidden_modules = [
    "contraagent._internal.errors",
    "contraagent._internal.platform",
    "contraagent._internal.commandline",
    "contraagent._internal.public",
    "contraagent._internal.docs",
    "fastapi",
    "starlette",
    "uvicorn",
    "sse_starlette",
    "httpx2",
    "psycopg",
    "boto3",
    "zstandard",
    "yaml",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "hub-monitor"
name = "hub/ reads and writes runs without monitor/, but for hub/server.py"
type = "forbidden"
source_modules = ["contraagent._internal.hub"]
forbidden_modules = ["contraagent._internal.monitor"]
ignore_imports = [
    # The one exception: hub/server.py serves the monitor's app over the hub's runs.
    "contraagent._internal.hub.server -> contraagent._internal.monitor.**",
]

[[tool.importlinter.contracts]]
id = "internal-protected"
name = "_internal is imported only by itself and the public modules (the examples import no _internal)"
type = "protected"
protected_modules = ["contraagent._internal", "contraagent._internal.**"]
allowed_importers = [
    "contraagent._internal",
    "contraagent._internal.**",
    "contraagent",
    "contraagent.__main__",
    "contraagent.config",
    "contraagent.backends",
    "contraagent.engine",
    "contraagent.plugins",
    "contraagent.monitor",
    "contraagent.monitor.api",
    "contraagent.testing",
]
as_packages = false

[[tool.importlinter.contracts]]
id = "internal-no-public"
name = "_internal imports no public module"
type = "forbidden"
source_modules = ["contraagent._internal", "contraagent._internal.**"]
forbidden_modules = [
    "contraagent",
    "contraagent.__main__",
    "contraagent.config",
    "contraagent.backends",
    "contraagent.engine",
    "contraagent.plugins",
    "contraagent.monitor",
    "contraagent.monitor.api",
    "contraagent.testing",
]
as_packages = false
allow_indirect_imports = true   # a direct import breaks the rule; a chain through it repeats it
