[build-system]
requires = ["hatchling>=1.27"]   # PEP 639 license metadata
build-backend = "hatchling.build"

[project]
name = "contraagent"
version = "0.1.0"
description = "Run coding-agent CLIs (claude -p, omp) as typed, supervised, observable tasks: contracts, failover, scheduling, resume, live monitor"
readme = "src/contraagent/docs/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomoaki Tani" }]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]
keywords = ["coding-agent", "claude", "llm", "agents", "pipeline", "orchestration", "supervisor", "failover", "monitoring"]
# No "License ::" classifier: PEP 639 forbids it next to a `license` expression.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/t-tani"
Source = "https://github.com/t-tani"

[project.optional-dependencies]
monitor = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0"]
hub = ["contraagent[monitor]", "httpx>=0.27", "psycopg[binary]>=3.2", "boto3>=1.34", "zstandard>=0.25"]

[project.scripts]
contraagent = "contraagent.cli:main"
contraagent-monitor = "contraagent.monitor.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6.2",
    "coverage>=7.10",       # [tool.coverage.run] patch = ["subprocess"]
    "httpx>=0.27",          # fastapi.testclient
    "ruff>=0.6",
    "pyright>=1.1.400",
    "contraagent[hub]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contraagent"]


[tool.hatch.build.targets.sdist]
# The sources of the web UI belong in the sdist; what Node installs or builds
# from them does not (hatch reads only the root .gitignore). Excluded
# directories must not be entered at all: hatch follows symlinks and visits each
# directory once, and pnpm links the workspace packages from node_modules, so
# walking node_modules first would make web/packages look already visited.
skip-excluded-dirs = true
exclude = [
    "web/node_modules",
    "web/**/node_modules",
    "web/**/dist",
    "web/**/.astro",
    "web/e2e/.runs",
    "web/test-results",
    "web/playwright-report",
    "web/packages/ui/custom-elements.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests run against the installed (editable) package, as the subprocesses they spawn do.
addopts = "-m 'not live'"
markers = [
    "live: calls real coding agents and spends tokens; run with `CONTRAAGENT_LIVE=1 uv run pytest -m live`",
]

[tool.coverage.run]
source = ["contraagent"]
branch = true
# The tests run `python -m contraagent` and hook scripts as child processes;
# measure those too (coverage >= 7.10).
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID", "T20", "RUF100"]
ignore = [
    "E731",   # a lambda bound to a name reads fine in tests and callbacks
    "B008",   # Overrides() as a frozen default argument is deliberate
    "UP042",  # Stop stays a (str, Enum): StrEnum would change what str(Stop.X) prints
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702", "B018", "T20"]
"src/contraagent/plugins/scaffold.py" = ["E501"]   # a template's markdown table
# The library reports through `logging`; only the command line and the examples print.
"src/contraagent/cli.py" = ["T20"]
"src/contraagent/docs/examples/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["contraagent"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
