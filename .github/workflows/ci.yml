# Lint, type-check and test on every supported Python on Linux and on one
# Python on macOS and Windows, plus one run against the lowest versions of the
# direct dependencies that pyproject.toml allows.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      # The files as committed: a CRLF checkout on Windows would change bytes the tests compare.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}   # overrides .python-version
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Every OS's branches type-check on every runner.
      - run: uv run pyright --pythonplatform Linux
      - run: uv run pyright --pythonplatform Darwin
      - run: uv run pyright --pythonplatform Windows
      - run: uv run lint-imports
      # pyproject.toml's addopts leave out the live, e2e and perf tests; the e2e
      # tests need docker and run on Linux only (`uv run pytest -m e2e`).
      - run: uv run pytest --cov

  lowest-direct:
    name: Lowest direct dependencies (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          # 3.12: the lowest pydantic-core has no wheel for 3.14.
          python-version: "3.12"
          enable-cache: true
      # Deselected here only: the committed openapi.json documents of the
      # monitor and the hub are generated by the locked fastapi/pydantic and
      # differ byte-for-byte under the oldest ones, and starlette's old
      # TestClient cannot parse an IPv6 base URL.
      - run: >-
          uv run --isolated --resolution lowest-direct pytest
          --deselect tests/test_monitor_api.py::test_the_committed_openapi_document_is_current
          --deselect tests/test_hub_server.py::test_the_committed_openapi_document_is_current
          --deselect tests/test_monitor_api.py::test_only_local_host_names_are_answered

  web:
    name: Web UI (types, lint, tests, committed build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      # The docs site renders the packages' documentation with `contraagent.docs`.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The generated API types match the committed OpenAPI document.
      - run: pnpm gen --check
      # Every message is extracted, translated, and built into src/locales.
      - run: pnpm i18n
      - run: git diff --exit-code -- packages/ui/xliff packages/ui/src/locales
      - run: pnpm --filter @contraagent/ui i18n:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The monitor serves the built UI from src/contraagent/_internal/monitor/static,
      # which is committed: rebuilding must not change it.
      - run: pnpm build
      # What an npm consumer gets: the built packages' types resolve on their own.
      - run: pnpm check:dist
      - run: git diff --exit-code -- ../src/contraagent/_internal/monitor/static
      - run: test -z "$(git status --porcelain -- ../src/contraagent/_internal/monitor/static)"

  web-e2e:
    name: Web UI end to end (Back, Forward, reload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      # Builds the page, runs the demo pipeline, serves it with the real monitor.
      - run: pnpm e2e
        working-directory: web
