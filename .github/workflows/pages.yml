# Build the documentation site (web/apps/docs) and deploy it to GitHub Pages,
# https://t-tani.github.io/contraagent/, on every push to main. The site is
# built for that base path (web/apps/docs/site.ts). The site's end-to-end tests
# (site.yml) pass first: a site that fails them is not deployed.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the deploy in progress, which
# runs to its end.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  e2e:
    name: Test the documentation site
    uses: ./.github/workflows/site.yml

  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      # The docs site renders the packages' documentation with `contraagent.docs`.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [e2e, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
