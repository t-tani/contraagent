name = "contraagent"
defaultTargets = ["Contraagent", "contraagent-lean"]

[leanOptions]
autoImplicit = false

# Every file under Contraagent/ is a module of the library and is built, whether another
# file imports it or not: no proof is left unchecked.
[[lean_lib]]
name = "Contraagent"
globs = ["Contraagent.+"]

# What the tests of the Python package read of the specification (Main.lean).
[[lean_exe]]
name = "contraagent-lean"
root = "Main"
