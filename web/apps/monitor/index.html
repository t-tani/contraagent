<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Both colour schemes: the browser paints the page in the reader's before the styles arrive (the theme's own rule names its scheme after). -->
    <meta name="color-scheme" content="light dark" />
    <!-- The sizes are in rem: the operating system's text scale reaches them where the browser offers it. -->
    <meta name="text-scale" content="scale" />
    <title>contraagent monitor</title>
    <!-- public/: favicon.svg (last, so a browser with SVG icons takes it) follows the colour scheme; the PNGs are for the others and for home screens. -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- vite.config.ts puts the theme here, before the first paint: the reader's choice and the themes' rules. -->
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        overflow: hidden;
        color: var(--ca-text);
        background: var(--ca-backdrop);
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <ca-monitor></ca-monitor>
  </body>
</html>
